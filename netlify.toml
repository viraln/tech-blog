[build]
  command = " git lfs install && git lfs pull && npm run build"
  publish = ".next"
  functions = "netlify/functions"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NEXT_TELEMETRY_DISABLED = "1"
  NODE_ENV = "production"
  NEXT_PUBLIC_SITE_URL = "https://trendiingz.com"

[functions]
  # Increase function timeout for potential slow operations
  node_bundler = "esbuild"
  included_files = ["content/**/*"]
  external_node_modules = ["gray-matter", "remark", "remark-html", "remark-gfm", "node-fetch"]

[dev]
  # Settings for netlify dev
  functions = "netlify/functions"
  publish = ".next"

# Specific redirect for article pagination API
[[redirects]]
  from = "/api/articles/page/*"
  to = "/.netlify/functions/articles"
  status = 200
  force = true

# Specific redirect for posts API
[[redirects]]
  from = "/api/posts"
  to = "/.netlify/functions/posts"
  status = 200
  force = true

# Redirect other API calls to Netlify Functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

# Handle client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Optimize asset caching
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable" 